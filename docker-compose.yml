# ==============================================================================
# SAIGONBANK - Publication Inventory Management System (PIMS)
# Docker Compose Orchestration (Production Ready)
# Architecture: MariaDB 11.4 + Spring Boot 3.5 (Camunda 7) + React Nginx
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE: MariaDB 11.4 LTS
  # ----------------------------------------------------------------------------
  database:
    image: mariadb:11.4
    container_name: pims-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sapassword
      MYSQL_DATABASE: ims
      MYSQL_USER: ims_user
      MYSQL_PASSWORD: ims_password
      TZ: Asia/Ho_Chi_Minh
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--default-time-zone=+07:00"
    ]
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pims-network

  # ----------------------------------------------------------------------------
  # 2. BACKEND: Spring Boot 3.5 + Camunda 7 Embedded + JDK 21
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend/ims
      dockerfile: Dockerfile
    image: pims-backend:latest
    container_name: pims-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ./backend/ims/.env
    environment:
      DB_URL: jdbc:mariadb://database:3306/ims?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    ports:
      - "${BACKEND_PORT:-8086}:8085"
    networks:
      - pims-network

  # ----------------------------------------------------------------------------
  # 3. FRONTEND: React + TypeScript + Vite + Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend/ims-fe
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: pims-frontend:latest
    container_name: pims-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - pims-network

# ------------------------------------------------------------------------------
# VOLUMES & NETWORKS
# ------------------------------------------------------------------------------
volumes:
  mariadb_data:
    name: pims_mariadb_data

networks:
  pims-network:
    name: pims-network
    driver: bridge
